[project]
name = "amtsbrief"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marwan Abdelhamid", email = "101995294+marwannelsayed@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
amtsbrief = "amtsbrief:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]