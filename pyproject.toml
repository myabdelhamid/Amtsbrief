[project]
name = "amtsbrief"
version = "0.1.0"
description = "Explains German official letters in plain English, with cited deadlines and amounts"
readme = "README.md"
authors = [
    { name = "Marwan Abdelhamid", email = "101995294+marwannelsayed@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.31.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false  # an app, not a library: nothing to build or install

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
